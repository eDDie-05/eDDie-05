<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Developer profile highlights</title>
<desc id="desc">Animated cyan and cyan cyber-terminal panels highlighting full-stack engineering, AI and machine learning, project building, and open-source development.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080B1A"/><stop offset=".55" stop-color="#080B1A"/><stop offset="1" stop-color="#080B1A"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#22D3EE" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1100" height="230" rx="18" fill="url(#bg)"/>
<rect width="1100" height="230" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1098" height="228" rx="17" fill="none" stroke="#22D3EE" stroke-opacity=".5"/>
<g fill="#22D3EE" font-family="monospace" font-size="12" letter-spacing="2"><text x="28" y="27">EDDie // ENGINEERING PROFILE</text><text x="1070" y="27" text-anchor="end">SYSTEM ONLINE</text></g>
<circle cx="1040" cy="23" r="4" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<g transform="translate(24 48)" font-family="monospace">
  <g><rect width="250" height="145" rx="12" fill="#080B1A" stroke="#22D3EE" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#22D3EE" font-size="12">01 / BUILD</text><text x="18" y="72" fill="#F5F3FF" font-size="20" font-weight="bold">FULL-STACK</text><text x="18" y="98" fill="#22D3EE" font-size="13">Web • APIs • Databases</text><path d="M18 119H210" stroke="#22D3EE" stroke-opacity=".25"/><text x="18" y="136" fill="#22D3EE" font-size="10">DESIGN / DEVELOP / DEPLOY</text></g>
  <g transform="translate(264)"><rect width="250" height="145" rx="12" fill="#080B1A" stroke="#22D3EE" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#22D3EE" font-size="12">02 / INTELLIGENCE</text><text x="18" y="72" fill="#F5F3FF" font-size="20" font-weight="bold">AI + MACHINE LEARNING</text><text x="18" y="98" fill="#22D3EE" font-size="13">Python • Data • Models</text><path d="M18 119H210" stroke="#22D3EE" stroke-opacity=".25"/><text x="18" y="136" fill="#22D3EE" font-size="10">EXPERIMENT / EVALUATE / IMPROVE</text></g>
  <g transform="translate(528)"><rect width="250" height="145" rx="12" fill="#080B1A" stroke="#22D3EE" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#22D3EE" font-size="12">03 / DELIVERY</text><text x="18" y="72" fill="#F5F3FF" font-size="20" font-weight="bold">PROJECT BUILDER</text><text x="18" y="98" fill="#22D3EE" font-size="13">Practical software solutions</text><path d="M18 119H210" stroke="#22D3EE" stroke-opacity=".25"/><text x="18" y="136" fill="#22D3EE" font-size="10">IDEA → CODE → WORKING PRODUCT</text></g>
  <g transform="translate(792)"><rect width="250" height="145" rx="12" fill="#080B1A" stroke="#22D3EE" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#22D3EE" font-size="12">04 / COMMUNITY</text><text x="18" y="72" fill="#F5F3FF" font-size="20" font-weight="bold">OPEN SOURCE</text><text x="18" y="98" fill="#22D3EE" font-size="13">Git • GitHub • Collaboration</text><path d="M18 119H210" stroke="#22D3EE" stroke-opacity=".25"/><text x="18" y="136" fill="#22D3EE" font-size="10">SHARE / CONTRIBUTE / GROW</text></g>
</g>
<rect x="24" y="207" width="1052" height="2" rx="1" fill="#22D3EE" opacity=".18"/>
<rect x="24" y="207" width="260" height="2" rx="1" fill="#22D3EE" filter="url(#glow)"><animate attributeName="x" values="24;816;24" dur="7s" repeatCount="indefinite"/></rect>
<g fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-width="1">
<path d="M18 42H110l18 12h40M1082 42H990l-18 12h-40M18 190h70l14-10h35M1082 190h-70l-14-10h-35"/>
<path d="M550 32v8m-5-4h10M550 194v8m-5-4h10"/>
</g>
<g fill="#22D3EE" filter="url(#glow)"><circle cx="18" cy="42" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="1082" cy="42" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle></g>
</svg>