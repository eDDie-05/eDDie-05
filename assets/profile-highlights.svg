<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Developer profile highlights</title>
<desc id="desc">Animated emerald terminal-style panels highlighting full-stack engineering, AI and machine learning, project building, and open-source development.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a14"/><stop offset=".55" stop-color="#0b241b"/><stop offset="1" stop-color="#07110e"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981"/><stop offset=".5" stop-color="#a3e635"/><stop offset="1" stop-color="#059669"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#34d399" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1100" height="230" rx="18" fill="url(#bg)"/>
<rect width="1100" height="230" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1098" height="228" rx="17" fill="none" stroke="#10b981" stroke-opacity=".5"/>
<g fill="#a7f3d0" font-family="monospace" font-size="12" letter-spacing="2"><text x="28" y="27">EDDie // ENGINEERING PROFILE</text><text x="1070" y="27" text-anchor="end">SYSTEM ONLINE</text></g>
<circle cx="1040" cy="23" r="4" fill="#a3e635" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<g transform="translate(24 48)" font-family="monospace">
  <g><rect width="250" height="145" rx="12" fill="#0b1c16" stroke="#10b981" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#a3e635" font-size="12">01 / BUILD</text><text x="18" y="72" fill="#ecfdf5" font-size="20" font-weight="bold">FULL-STACK</text><text x="18" y="98" fill="#6ee7b7" font-size="13">Web • APIs • Databases</text><path d="M18 119H210" stroke="#34d399" stroke-opacity=".25"/><text x="18" y="136" fill="#a7f3d0" font-size="10">DESIGN / DEVELOP / DEPLOY</text></g>
  <g transform="translate(264)"><rect width="250" height="145" rx="12" fill="#0b1c16" stroke="#10b981" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#a3e635" font-size="12">02 / INTELLIGENCE</text><text x="18" y="72" fill="#ecfdf5" font-size="20" font-weight="bold">AI + MACHINE LEARNING</text><text x="18" y="98" fill="#6ee7b7" font-size="13">Python • Data • Models</text><path d="M18 119H210" stroke="#34d399" stroke-opacity=".25"/><text x="18" y="136" fill="#a7f3d0" font-size="10">EXPERIMENT / EVALUATE / IMPROVE</text></g>
  <g transform="translate(528)"><rect width="250" height="145" rx="12" fill="#0b1c16" stroke="#10b981" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#a3e635" font-size="12">03 / DELIVERY</text><text x="18" y="72" fill="#ecfdf5" font-size="20" font-weight="bold">PROJECT BUILDER</text><text x="18" y="98" fill="#6ee7b7" font-size="13">Practical software solutions</text><path d="M18 119H210" stroke="#34d399" stroke-opacity=".25"/><text x="18" y="136" fill="#a7f3d0" font-size="10">IDEA → CODE → WORKING PRODUCT</text></g>
  <g transform="translate(792)"><rect width="250" height="145" rx="12" fill="#0b1c16" stroke="#10b981" stroke-opacity=".7"/><path d="M0 12Q0 0 12 0H238Q250 0 250 12" fill="none" stroke="url(#edge)" stroke-width="3"/><text x="18" y="35" fill="#a3e635" font-size="12">04 / COMMUNITY</text><text x="18" y="72" fill="#ecfdf5" font-size="20" font-weight="bold">OPEN SOURCE</text><text x="18" y="98" fill="#6ee7b7" font-size="13">Git • GitHub • Collaboration</text><path d="M18 119H210" stroke="#34d399" stroke-opacity=".25"/><text x="18" y="136" fill="#a7f3d0" font-size="10">SHARE / CONTRIBUTE / GROW</text></g>
</g>
<rect x="24" y="207" width="1052" height="2" rx="1" fill="#10b981" opacity=".18"/>
<rect x="24" y="207" width="260" height="2" rx="1" fill="#a3e635" filter="url(#glow)"><animate attributeName="x" values="24;816;24" dur="7s" repeatCount="indefinite"/></rect>
</svg>