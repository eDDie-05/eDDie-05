<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="126" viewBox="0 0 1200 126" role="img" aria-labelledby="t d">
<title id="t">Animated engineering technology icons</title><desc id="d">A row of animated line-art icons representing code, data, machine learning, cloud systems and deployment.</desc>
