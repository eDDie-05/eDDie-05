<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">AI and Machine Learning animated banner</title>
<desc id="desc">A dark blue animated neural network with glowing nodes and connecting lines, representing artificial intelligence and machine learning.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset=".55" stop-color="#102b55"/><stop offset="1" stop-color="#071426"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8" stop-opacity=".12"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#818cf8" stop-opacity=".12"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="260" rx="22" fill="url(#bg)"/>
<g fill="none" stroke="url(#line)" stroke-width="2">
 <path d="M70 65L220 42L365 90L520 48L680 86L850 45L940 95"/>
 <path d="M70 65L220 170L365 90L520 205L680 86L850 190L940 95"/>
 <path d="M70 205L220 42L365 210L520 48L680 205L850 45"/>
 <path d="M70 205L220 170L365 210L520 205L680 205L850 190L940 95"/>
 <path d="M220 42L220 170M365 90L365 210M520 48L520 205M680 86L680 205M850 45L850 190"/>
</g>
<g fill="#38bdf8" filter="url(#glow)">
 <circle cx="70" cy="65" r="7"><animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="220" cy="42" r="7"><animate attributeName="r" values="6;10;6" dur="2.7s" repeatCount="indefinite"/></circle>
 <circle cx="365" cy="90" r="8"><animate attributeName="r" values="5;10;5" dur="1.9s" repeatCount="indefinite"/></circle>
 <circle cx="520" cy="48" r="7"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="680" cy="86" r="8"><animate attributeName="r" values="5;10;5" dur="2.1s" repeatCount="indefinite"/></circle>
 <circle cx="850" cy="45" r="7"><animate attributeName="r" values="5;9;5" dur="2.6s" repeatCount="indefinite"/></circle>
 <circle cx="940" cy="95" r="7"><animate attributeName="r" values="5;9;5" dur="2.3s" repeatCount="indefinite"/></circle>
</g>
<g fill="#a5f3fc" filter="url(#glow)">
 <circle cx="70" cy="205" r="6"/><circle cx="220" cy="170" r="7"/><circle cx="365" cy="210" r="7"/><circle cx="520" cy="205" r="8"/><circle cx="680" cy="205" r="7"/><circle cx="850" cy="190" r="7"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <text x="500" y="118" fill="#ffffff" font-size="31" font-weight="700" letter-spacing="3">ARTIFICIAL INTELLIGENCE</text>
 <text x="500" y="153" fill="#67e8f9" font-size="23" font-weight="600" letter-spacing="5">MACHINE LEARNING</text>
 <text x="500" y="180" fill="#cbd5e1" font-size="13" letter-spacing="2">LEARN • BUILD • EXPERIMENT • IMPROVE</text>
</g>
<path d="M70 235H930" stroke="#38bdf8" stroke-opacity=".3" stroke-width="2"/>
<path d="M70 235H930" stroke="#67e8f9" stroke-width="2" stroke-dasharray="70 930">
 <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5s" repeatCount="indefinite"/>
</path>
</svg>