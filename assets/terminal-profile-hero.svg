<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">eDDie developer terminal profile</title><desc id="desc">A clean dark terminal-inspired banner with emerald green command-line accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B0A"/><stop offset=".55" stop-color="#101916"/><stop offset="1" stop-color="#07110E"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34D399" stop-opacity="0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#6EE7B7" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="330" rx="22" fill="url(#bg)"/><rect width="1200" height="330" rx="22" fill="url(#grid)"/>
<rect x="24" y="22" width="1152" height="286" rx="16" fill="none" stroke="#34D399" stroke-opacity=".34"/>
<rect x="24" y="22" width="1152" height="42" rx="16" fill="#15221D"/><path d="M24 48V64H1176V48" fill="#15221D"/>
<circle cx="51" cy="43" r="6" fill="#FB7185"/><circle cx="73" cy="43" r="6" fill="#FBBF24"/><circle cx="95" cy="43" r="6" fill="#34D399"/>
<text x="120" y="48" fill="#9CA3AF" font-family="monospace" font-size="13">eddie@workspace: ~/profile</text>
<text x="74" y="128" fill="#6EE7B7" font-family="monospace" font-size="17">$ whoami</text>
<text x="74" y="190" fill="#F0FDF4" font-family="monospace" font-size="54" font-weight="700" letter-spacing="-2">eDDie_05</text>
<text x="76" y="226" fill="#A7F3D0" font-family="monospace" font-size="19">FULL-STACK DEVELOPER <tspan fill="#4B806A">/</tspan> AI &amp; MACHINE LEARNING ENGINEER</text>
<path d="M76 251H690" stroke="url(#line)" stroke-width="2"/>
