<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">eDDie developer terminal profile</title><desc id="desc">A clean dark terminal-inspired banner with violet and cyan cyber-terminal accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A18"/><stop offset=".55" stop-color="#11152B"/><stop offset="1" stop-color="#080B1A"/></linearGradient>
