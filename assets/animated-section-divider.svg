<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="58" viewBox="0 0 1200 58" role="img" aria-label="Animated futuristic circuit board divider">
<defs>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#1d4ed8" stop-opacity=".1"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".1"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g fill="none" stroke="url(#line)" stroke-width="1.5">
 <path d="M0 29H180L205 8H340L360 29H840L860 8H995L1020 29H1200"/>
 <path d="M0 39H115L135 50H270M1200 39H1085L1065 50H930" opacity=".55"/>
 <path d="M430 29V12H470M770 29V12H730" opacity=".7"/>
</g>
<g fill="#67e8f9" filter="url(#glow)">
 <circle cx="180" cy="29" r="3"/><circle cx="340" cy="8" r="3"/><circle cx="860" cy="8" r="3"/><circle cx="1020" cy="29" r="3"/>
 <circle cx="270" cy="50" r="2"/><circle cx="930" cy="50" r="2"/>
</g>
<path d="M0 29H1200" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 22" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-216" dur="5s" repeatCount="indefinite"/></path>
<g fill="none" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"><path d="M600 4V54M580 29H620"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></path></g>
<circle cx="600" cy="29" r="5" fill="#fff" filter="url(#glow)"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
