name: Daily GitHub Project

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-github-project
  cancel-in-progress: false

jobs:
  create-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and publish a new project
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/daily_project_factory.py
